<!DOCTYPE html>
<html lang="ne">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaya Vyaya Khata - Digital Khata Pana</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            background-color: #f8fafc;
            font-family: var(--font-primary);
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ── Header Styling (Hidden in Print) ── */
        .landing-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.2);
            position: relative;
            overflow: hidden;
        }

        .landing-header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            animation: rotateBg 25s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-content {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .school-info h1 {
            font-family: var(--font-nepali);
            font-size: 1.5rem;
            margin: 0;
            color: #f8fafc;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        /* ── Main Content ── */
        .main-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Toolbar Section (Hidden in Print) */
        .toolbar-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 0.9rem;
            color: #475569;
            font-weight: 600;
        }

        .filter-group select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            min-width: 150px;
        }

        .btn-action {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 42px;
            margin-top: 24px;
        }

        .btn-action:hover {
            background: #2563eb;
        }
        
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-secondary { background: #64748b; }
        .btn-secondary:hover { background: #475569; }

        /* Table Report Section */
        .report-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            overflow-x: auto;
        }

        .report-header {
            text-align: center;
            margin-bottom: 20px;
            display: none; /* Only show in print */
        }
        .report-header h2 { margin: 0 0 5px 0; font-size: 1.5rem; }
        .report-header h3 { margin: 0; font-size: 1.2rem; font-weight: normal; }

        .entries-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        .entries-table th, .entries-table td {
            border: 1px solid #000;
            padding: 8px 12px;
            text-align: center;
            vertical-align: middle;
            color: #0f172a;
        }

        .entries-table th {
            background-color: #f8fafc;
            font-weight: bold;
        }

        /* ── Print Styles ── */
        @media print {
            @page {
                size: A4 portrait;
                margin: 5mm; /* Narrow margin */
            }

            body {
                background: white;
                color: black;
                font-size: 11pt;
            }

            .landing-header, .toolbar-section, .btn-action {
                display: none !important;
            }

            .main-container { margin: 0; padding: 0; max-width: 100%; }
            .report-card { box-shadow: none; border: none; padding: 0; }
            .report-header { display: block; }

            .entries-table {
                width: 100%; min-width: 100%; page-break-inside: auto;
            }
            .entries-table tr { page-break-inside: avoid; page-break-after: auto; }
            .entries-table thead { display: table-header-group; }
            .entries-table tfoot { display: table-footer-group; }
            
            .entries-table th, .entries-table td {
                border: 1px solid #000;
                color: #000;
                padding: 6px 10px;
            }
            .entries-table th { background-color: white !important; color: black; }
        }
    </style>
</head>

<body>

    <header class="landing-header">
        <div class="header-content">
            <div class="school-info">
                <h1>रिपोर्ट: आय व्यय खाता (Income / Expenditure Statement)</h1>
            </div>
            <div>
                <a href="reports.html" class="btn-back">← पछाडि जानुहोस् (Back)</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        
        <div class="toolbar-section">
            <div class="filter-group">
                <label>Fiscal Year (आर्थिक वर्ष)</label>
                <select id="fiscal_year">
                    <option value="2083/84">2083/84</option>
                    <option value="2082/83">2082/83</option>
                    <option value="2081/82">2081/82</option>
                    <option value="2080/81">2080/81</option>
                </select>
            </div>
            <button class="btn-action" onclick="loadReport()">
                🔍 Load Report
            </button>
            <div style="flex-grow: 1;"></div>
            <button class="btn-action btn-success" onclick="exportToExcel()">
                📊 Export Excel
            </button>
            <button class="btn-action btn-secondary" onclick="window.print()">
                🖨️ Print (A4 Portrait)
            </button>
        </div>

        <div class="report-card">
            
            <div class="report-header">
                <h2 id="print_school_name">श्री विद्यालयको नाम</h2>
                <h3 id="print_school_address">ठेगाना</h3>
            </div>

            <table class="entries-table" id="reportTable">
                <thead>
                    <tr>
                        <th colspan="4" style="font-size: 1.3rem; padding: 15px;">आ.व. <span id="print_fy"></span> को आय / व्यय विवरण</th>
                    </tr>
                    <tr>
                        <th colspan="2" style="font-size: 1.2rem; width: 50%;">आम्दानी</th>
                        <th colspan="2" style="font-size: 1.2rem; width: 50%;">खर्च</th>
                    </tr>
                    <tr>
                        <th>शिर्षक</th>
                        <th>रकम</th>
                        <th>शिर्षक</th>
                        <th>रकम</th>
                    </tr>
                </thead>
                <tbody id="dynamic-tbody">
                    <tr><td colspan="4" style="padding: 30px; color: #64748b;">कृपया आर्थिक वर्ष छानेर Load Report मा क्लिक गर्नुहोस्।</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (sessionStorage.getItem('school_user_logged_in') !== 'true') {
                window.location.href = 'school-login.html';
                return;
            }

            if (window.initDatabase) {
                await window.initDatabase();
            }

            if (window._activeSchoolInfo) {
                document.getElementById('print_school_name').innerText = window._activeSchoolInfo.schoolName || '';
                document.getElementById('print_school_address').innerText = window._activeSchoolInfo.address || '';
            }
        });

        async function loadReport() {
            if (!window._activeSchoolInfo || !supabaseClient) return;
            const schoolId = window._activeSchoolInfo.id;
            const fiscalYear = document.getElementById('fiscal_year').value;
            
            document.getElementById('print_fy').innerText = fiscalYear;
            
            const tbody = document.getElementById('dynamic-tbody');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 20px;">डाटा तानिँदैछ... (Loading...)</td></tr>`;

            // Fetch all entries for the selected fiscal year
            const { data: vouchers, error } = await supabaseClient
                .from('bnk_vouchers')
                .select(`
                    id, 
                    bnk_entries (
                        entry_type, cash_debit, cash_credit, bank_debit, bank_credit, bibidh_debit, bibidh_credit,
                        ledger_subheadings (name)
                    )
                `)
                .eq('school_id', schoolId)
                .eq('fiscal_year', fiscalYear);

            // Fetch opening balances
            const { data: obData, error: obError } = await supabaseClient
                .from('opening_balances')
                .select('amount')
                .eq('school_id', schoolId);

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" style="color:red; padding: 20px;">त्रुटि (Error): ${error.message}</td></tr>`;
                return;
            }

            let totalOpeningBalance = 0;
            if (obData) {
                obData.forEach(ob => {
                    totalOpeningBalance += Number(ob.amount) || 0;
                });
            }

            const incomeMap = new Map();
            const expenseMap = new Map();
            
            let totalCashDebit = 0;
            let totalCashCredit = 0;

            vouchers.forEach(v => {
                const entries = v.bnk_entries || [];
                
                entries.forEach(e => {
                    totalCashDebit += Number(e.cash_debit) || 0;
                    totalCashCredit += Number(e.cash_credit) || 0;

                    const subName = e.ledger_subheadings ? e.ledger_subheadings.name : 'Unknown';

                    if (e.entry_type === 'income') {
                        const amt = (Number(e.cash_debit) || 0) + (Number(e.bank_debit) || 0) + (Number(e.bibidh_debit) || 0);
                        if (amt > 0) {
                            if (!incomeMap.has(subName)) incomeMap.set(subName, 0);
                            incomeMap.set(subName, incomeMap.get(subName) + amt);
                        }
                    } else if (e.entry_type === 'expense') {
                        const amt = (Number(e.cash_credit) || 0) + (Number(e.bank_credit) || 0) + (Number(e.bibidh_credit) || 0);
                        if (amt > 0) {
                            if (!expenseMap.has(subName)) expenseMap.set(subName, 0);
                            expenseMap.set(subName, expenseMap.get(subName) + amt);
                        }
                    }
                });
            });

            const incomeArr = Array.from(incomeMap.entries()); // [name, amount]
            const expenseArr = Array.from(expenseMap.entries());

            // Prepare list for rendering
            const leftColumn = [];
            const rightColumn = [];

            // Left Side (Income)
            leftColumn.push({ name: 'अ.ल्या.', amount: totalOpeningBalance });
            let totalIncomeSum = totalOpeningBalance;
            incomeArr.forEach(([name, amt]) => {
                leftColumn.push({ name, amount: amt });
                totalIncomeSum += amt;
            });

            // Right Side (Expense)
            let totalExpenseSum = 0;
            expenseArr.forEach(([name, amt]) => {
                rightColumn.push({ name, amount: amt });
                totalExpenseSum += amt;
            });

            // Calculate Balances
            const cashBalance = totalCashDebit - totalCashCredit;
            
            // Bank balance acts as balancing figure so Income Total == Expense Total perfectly
            const bankBalance = totalIncomeSum - totalExpenseSum - cashBalance;

            rightColumn.push({ name: 'नगद', amount: cashBalance });
            rightColumn.push({ name: 'रा.वा. बैंक', amount: bankBalance });
            
            totalExpenseSum += cashBalance + bankBalance;

            // Generate rows
            const maxRows = Math.max(leftColumn.length, rightColumn.length);
            let tbodyHtml = '';

            for (let i = 0; i < maxRows; i++) {
                const inc = leftColumn[i] || { name: '', amount: '' };
                const exp = rightColumn[i] || { name: '', amount: '' };

                const formatAmt = (val) => val === '' ? '' : (Number(val) === 0 ? '0.00' : Number(val).toFixed(2));

                tbodyHtml += `
                    <tr>
                        <td style="text-align: right;">${inc.name}</td>
                        <td style="text-align: right;">${formatAmt(inc.amount)}</td>
                        <td style="text-align: right;">${exp.name}</td>
                        <td style="text-align: right;">${formatAmt(exp.amount)}</td>
                    </tr>
                `;
            }

            // Total Row
            tbodyHtml += `
                <tr>
                    <td style="text-align: center; font-weight: bold;">जम्मा</td>
                    <td style="text-align: right; font-weight: bold;">${totalIncomeSum.toFixed(2)}</td>
                    <td style="text-align: center; font-weight: bold;">जम्मा</td>
                    <td style="text-align: right; font-weight: bold;">${totalExpenseSum.toFixed(2)}</td>
                </tr>
            `;

            tbody.innerHTML = tbodyHtml;
        }

        function exportToExcel() {
            const table = document.getElementById("reportTable");
            const wb = XLSX.utils.table_to_book(table, {sheet: "Aaya Vyaya"});
            XLSX.writeFile(wb, `Aaya_Vyaya_Khata.xlsx`);
        }
    </script>
</body>
</html>
