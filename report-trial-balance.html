<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial Balance Report - Digital Khata Pana</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            background-color: #f8fafc;
            font-family: var(--font-primary);
            color: #1e293b;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ── Header Styling (Hidden in Print) ── */
        .landing-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: white;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(30, 58, 138, 0.2);
            position: relative;
            overflow: hidden;
        }

        .landing-header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            animation: rotateBg 25s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-content {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .school-info h1 {
            font-family: var(--font-nepali);
            font-size: 1.5rem;
            margin: 0;
            color: #f8fafc;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        /* ── Main Content ── */
        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Filter Section (Hidden in Print) */
        .filter-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
        }

        .form-group select {
            padding: 10px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            width: 200px;
            background-color: white;
        }

        .form-group select:focus {
            border-color: #3b82f6;
        }

        .btn-action {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            background: #2563eb;
        }
        
        .btn-success {
            background: #10b981;
        }
        .btn-success:hover {
            background: #059669;
        }

        .btn-secondary {
            background: #64748b;
        }
        .btn-secondary:hover {
            background: #475569;
        }

        /* Table Report Section */
        .report-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            overflow-x: auto;
        }

        .report-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .report-header h2 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            display: none; /* Only show in print */
        }
        .report-header h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: normal;
            display: none; /* Only show in print */
        }
        .report-header h4 {
            margin: 10px 0 0 0;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .entries-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        .entries-table th, .entries-table td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
            color: #0f172a;
        }

        .entries-table th {
            font-weight: bold;
            background-color: #0f2a5b;
            color: white !important;
        }

        .tfoot-total {
            font-weight: bold;
        }

        /* ── Print Styles ── */
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }

            body {
                background: white;
                color: black;
                font-size: 12pt;
            }

            /* Hide UI Elements */
            .landing-header, .filter-section, .btn-action {
                display: none !important;
            }

            .main-container {
                margin: 0;
                padding: 0;
                max-width: 100%;
            }

            .report-card {
                box-shadow: none;
                border: none;
                padding: 0;
            }

            .report-header h2, .report-header h3 {
                display: block; /* Show header in print */
            }

            .entries-table {
                width: 100%;
                min-width: 100%;
                page-break-inside: auto;
            }

            .entries-table tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }

            .entries-table th, .entries-table td {
                border: 1px solid #000;
                color: #000;
                padding: 8px;
            }

            .entries-table th {
                background-color: transparent !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>

    <header class="landing-header">
        <div class="header-content">
            <div class="school-info">
                <h1>रिपोर्ट: सन्तुलन परीक्षण (Report: Trial Balance)</h1>
            </div>
            <div>
                <a href="reports.html" class="btn-back">← पछाडि जानुहोस् (Back)</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        
        <div class="filter-section">
            <div class="form-group">
                <label>आर्थिक वर्ष (Fiscal Year)</label>
                <select id="fiscal_year_select" onchange="loadReport()">
                    <option value="2080/81">२०८०/०८१</option>
                    <option value="2081/82">२०८१/०८२</option>
                    <option value="2082/83" selected>२०८२/०८३</option>
                    <option value="2083/84">२०८३/०८४</option>
                </select>
            </div>
            <button class="btn-action" onclick="loadReport()">
                🔍 Load Report
            </button>
            <div style="flex-grow: 1;"></div>
            <button class="btn-action btn-success" onclick="exportToExcel()">
                📊 Export Excel
            </button>
            <button class="btn-action btn-secondary" onclick="window.print()">
                🖨️ Print
            </button>
        </div>

        <div class="report-card">
            
            <div class="report-header">
                <h2 id="print_school_name">श्री विद्यालयको नाम</h2>
                <h3 id="print_school_address">ठेगाना</h3>
                <h4>सन्तुलन परीक्षण ( आ.व. <span id="print_fiscal_year">२०८२/०८३</span> )</h4>
            </div>

            <table class="entries-table" id="reportTable">
                <thead>
                    <tr>
                        <th style="width: 10%;">क्र.सं.</th>
                        <th style="width: 30%;">विवरण</th>
                        <th style="width: 20%;">डेबिट</th>
                        <th style="width: 20%;">क्रेडिट</th>
                        <th style="width: 20%;">कैफियत</th>
                    </tr>
                </thead>
                <tbody id="entries-tbody">
                    <tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 30px;">Load Report मा क्लिक गर्नुहोस्।</td></tr>
                </tbody>
                <tfoot id="entries-tfoot">
                    <tr class="tfoot-total">
                        <td colspan="2" style="text-align: center;">जम्मा</td>
                        <td id="tot_debit">0</td>
                        <td id="tot_credit">0</td>
                        <td id="tot_balance">0</td>
                    </tr>
                </tfoot>
            </table>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (sessionStorage.getItem('school_user_logged_in') !== 'true') {
                window.location.href = 'school-login.html';
                return;
            }

            if (window.initDatabase) {
                await window.initDatabase();
            }

            // Set Print Headers
            if (window._activeSchoolInfo) {
                document.getElementById('print_school_name').innerText = window._activeSchoolInfo.schoolName || '';
                document.getElementById('print_school_address').innerText = window._activeSchoolInfo.address || '';
            }

            // Load initial report for default selection
            loadReport();
        });

        async function loadReport() {
            if (!window._activeSchoolInfo || !supabaseClient) return;
            const schoolId = window._activeSchoolInfo.id;
            
            const selectEl = document.getElementById('fiscal_year_select');
            const fiscalYearValue = selectEl.value; // e.g. "2082/83"
            const fiscalYearText = selectEl.options[selectEl.selectedIndex].text; // e.g. "२०८२/०८३"

            // Update print header
            document.getElementById('print_fiscal_year').innerText = fiscalYearText;

            const tbody = document.getElementById('entries-tbody');
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">लोड हुँदैछ...</td></tr>`;

            // Fetch vouchers by fiscal_year
            const { data: vouchers, error } = await supabaseClient
                .from('bnk_vouchers')
                .select(`
                    id,
                    fiscal_year,
                    bnk_entries (
                        cash_debit, cash_credit,
                        bank_debit, bank_credit,
                        budget_kharcha,
                        peski_dieko, peski_farchiyeko,
                        bibidh_debit, bibidh_credit
                    )
                `)
                .eq('school_id', schoolId)
                .eq('fiscal_year', fiscalYearValue);
            
            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align: center;">Error loading report.</td></tr>`;
                return;
            }

            // Aggregate totals
            let cashDr = 0, cashCr = 0;
            let bankDr = 0, bankCr = 0;
            let expDr = 0, expCr = 0;
            let advDr = 0, advCr = 0;
            let miscDr = 0, miscCr = 0;

            if (vouchers && vouchers.length > 0) {
                vouchers.forEach(v => {
                    if(v.bnk_entries && v.bnk_entries.length > 0) {
                        v.bnk_entries.forEach(entry => {
                            cashDr += Number(entry.cash_debit) || 0;
                            cashCr += Number(entry.cash_credit) || 0;
                            
                            bankDr += Number(entry.bank_debit) || 0;
                            bankCr += Number(entry.bank_credit) || 0;
                            
                            expDr += Number(entry.budget_kharcha) || 0;
                            
                            advDr += Number(entry.peski_dieko) || 0;
                            advCr += Number(entry.peski_farchiyeko) || 0;
                            
                            miscDr += Number(entry.bibidh_debit) || 0;
                            miscCr += Number(entry.bibidh_credit) || 0;
                        });
                    }
                });
            }

            // Create Rows
            const rowsData = [
                { sn: "१", name: "नगद", dr: cashDr, cr: cashCr },
                { sn: "२", name: "बैंक", dr: bankDr, cr: bankCr },
                { sn: "३", name: "खर्च", dr: expDr, cr: expCr },
                { sn: "४", name: "पेश्की", dr: advDr, cr: advCr },
                { sn: "५", name: "विविध", dr: miscDr, cr: miscCr }
            ];

            let html = "";
            let totalDr = 0;
            let totalCr = 0;

            rowsData.forEach(row => {
                let drDisp = row.dr ? row.dr : "";
                let crDisp = row.cr ? row.cr : "";
                let balance = row.dr - row.cr;
                let balDisp = balance;

                html += `
                    <tr>
                        <td>${row.sn}</td>
                        <td style="text-align: left;">${row.name}</td>
                        <td>${drDisp}</td>
                        <td>${crDisp}</td>
                        <td>${balDisp}</td>
                    </tr>
                `;

                totalDr += row.dr;
                totalCr += row.cr;
            });

            tbody.innerHTML = html;

            document.getElementById('tot_debit').innerText = totalDr ? totalDr : "";
            document.getElementById('tot_credit').innerText = totalCr ? totalCr : "";
            document.getElementById('tot_balance').innerText = totalDr - totalCr;
        }

        function exportToExcel() {
            const table = document.getElementById("reportTable");
            const selectEl = document.getElementById('fiscal_year_select');
            const fiscalYearText = selectEl.options[selectEl.selectedIndex].text;
            
            // Clean filename
            const safeFy = fiscalYearText.replace(/\//g, '-');

            const wb = XLSX.utils.table_to_book(table, {sheet: "Trial Balance"});
            XLSX.writeFile(wb, `Trial_Balance_${safeFy}.xlsx`);
        }
    </script>
</body>
</html>
