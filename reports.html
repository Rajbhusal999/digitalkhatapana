<!DOCTYPE html>
<html lang="np">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger Reports - School Income Expenditure</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Nepali Datepicker -->
    <link href="https://nepalidatepicker.sajanmaharjan.com.np/nepali.datepicker/css/nepali.datepicker.v4.0.1.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://nepalidatepicker.sajanmaharjan.com.np/nepali.datepicker/js/nepali.datepicker.v4.0.1.min.js" type="text/javascript"></script>
</head>
<body>
    <!-- Top Gov Bar (Same as main pages) -->
    <div class="top-gov-bar">
        <span>
            <a href="index.html" style="color: white; text-decoration: none; font-weight: bold; margin-right: 15px; display: inline-flex; align-items: center; gap: 4px; border-right: 1px solid rgba(255,255,255,0.3); padding-right:12px;">
                🏠 गृह पृष्ठ (Home)
            </a>
            नेपाल सरकार | शिक्षा, विज्ञान तथा प्रविधि मन्त्रालय
        </span>
    </div>

    <!-- Header -->
    <header style="padding: 15px 25px;">
        <div class="brand-section">
            <div id="user-school-logo-container" style="display: flex; align-items: center;">
                <svg class="gov-logo" viewBox="0 0 100 100" width="50" height="50">
                    <circle cx="50" cy="50" r="46" fill="#0b2b61" />
                    <circle cx="50" cy="50" r="42" fill="white" />
                    <circle cx="50" cy="50" r="38" fill="#e63946" opacity="0.15" />
                    <path d="M25 65 L40 40 L52 55 L65 30 L80 65 Z" fill="#b0c4de" stroke="#0b2b61" stroke-width="1.5" />
                    <path d="M35 65 L48 45 L58 58 L72 38 L80 65 Z" fill="#ffffff" opacity="0.8" />
                    <path d="M22 35 L32 30 L27 42 L35 42 L25 52 L25 35" fill="#dc143c" stroke="#003893" stroke-width="1" />
                    <path d="M42 68 C45 66, 55 66, 58 68" stroke="#0b2b61" stroke-width="3" stroke-linecap="round" />
                    <path d="M45 71 C48 69, 52 69, 55 71" stroke="#0b2b61" stroke-width="2.5" stroke-linecap="round" />
                    <path d="M45 23 L50 17 L55 23 L50 25 Z" fill="#ffb300" />
                    <circle cx="50" cy="8" r="2.5" fill="#ffb300" />
                    <path d="M15 50 A 35 35 0 0 0 85 50" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="2 3" />
                </svg>
            </div>
            <div class="brand-titles">
                <h1 id="txt-school-name" style="font-size: 1.5rem;">श्री जन जागृति माध्यमिक विद्यालय</h1>
                <p id="txt-gov-subtitle" style="font-size: 0.85rem; margin-top: 2px;">खाता तथा स्रेस्ता प्रतिवेदन प्रणाली</p>
            </div>
        </div>
    </header>

    <main style="padding: 20px;">
        <div class="reports-layout">
            <!-- Sidebar Navigation -->
            <div class="reports-sidebar">
                <div class="reports-sidebar-title">
                    प्रतिवेदन सूची (Reports)
                </div>
                <button class="report-nav-btn active" data-target="bank_nagadi" onclick="loadReport('bank_nagadi')">
                    <span>🏦</span> बैंक नगदी किताब
                </button>
                <button class="report-nav-btn" data-target="aamdani_khata" onclick="loadReport('aamdani_khata')">
                    <span>📥</span> आम्दानी खाता
                </button>
                <button class="report-nav-btn" data-target="kharcha_khata" onclick="loadReport('kharcha_khata')">
                    <span>📤</span> खर्च खाता
                </button>
                <button class="report-nav-btn" data-target="nagad_bank" onclick="loadReport('nagad_bank')">
                    <span>💵</span> नगद बैंक खाता
                </button>
                <button class="report-nav-btn" data-target="aaya_vyaya" onclick="loadReport('aaya_vyaya')">
                    <span>⚖️</span> आय व्यय विवरण
                </button>
                <button class="report-nav-btn" data-target="trial_balance" onclick="loadReport('trial_balance')">
                    <span>🧮</span> ट्रायल ब्यालेन्स
                </button>
            </div>

            <!-- Report Content Area -->
            <div class="reports-content-pane">
                <!-- Header -->
                <div class="reports-content-header">
                    <div>
                        <h2 id="report-title">बैंक नगदी किताब</h2>
                        <p id="report-subtitle">Bank Cash Book Report</p>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-secondary" onclick="exportReportPDF()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            PDF
                        </button>
                        <button class="btn-secondary" onclick="exportReportExcel()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="8" y1="13" x2="16" y2="13"></line>
                                <line x1="8" y1="17" x2="16" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                            Excel
                        </button>
                        <button class="btn-primary" onclick="window.print()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                                <rect x="6" y="14" width="12" height="8"></rect>
                            </svg>
                            Print
                        </button>
                    </div>
                </div>

                <!-- Filters -->
                <div class="reports-filters-bar">
                    <div class="filter-group">
                        <label>आर्थिक वर्ष (Fiscal Year)</label>
                        <select id="filter-fiscal-year" class="form-control" onchange="generateReport()">
                            <option value="all">सबै (All)</option>
                            <option value="2082/83" selected>२०८२/८३</option>
                            <option value="2081/82">२०८१/८२</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>देखि मिति (From Date)</label>
                        <input type="text" id="filter-from-date" class="form-control nepali-date" placeholder="YYYY-MM-DD">
                    </div>
                    <div class="filter-group">
                        <label>सम्म मिति (To Date)</label>
                        <input type="text" id="filter-to-date" class="form-control nepali-date" placeholder="YYYY-MM-DD">
                    </div>
                    <button class="btn-primary" style="margin-top: 22px;" onclick="generateReport()">खोज्नुहोस् (Filter)</button>
                    <button id="btn-toggle-entry" class="btn-portal" style="margin-top: 22px; margin-left: auto; display: none;" onclick="toggleEntryForm()">
                        + नयाँ प्रविष्टि (New Entry)
                    </button>
                </div>

                <!-- Inline Data Entry Form (Hidden by default, shown for Bank Cash Book) -->
                <div id="inline-entry-form-container" style="display: none; padding: 20px; border-bottom: 1px solid var(--border); background: #fdfdfd;">
                    <h3 style="font-family: var(--font-nepali); color: var(--secondary); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">नयाँ कारोबार प्रविष्टि (New Transaction Entry)</h3>
                    <form id="inline-entry-form" onsubmit="handleInlineSubmit(event)">
                        <div style="display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 15px; margin-bottom: 15px;">
                            <div class="form-group">
                                <label>मिति (Date) *</label>
                                <input type="text" id="tx-date" required class="form-control nepali-date" placeholder="YYYY-MM-DD">
                            </div>
                            <div class="form-group">
                                <label>भौचर नं (Voucher No) *</label>
                                <input type="text" id="tx-voucher" required class="form-control" placeholder="e.g. V-01">
                            </div>
                            <div class="form-group">
                                <label>विवरण (Particulars) *</label>
                                <input type="text" id="tx-particulars" required class="form-control" placeholder="Description of transaction">
                            </div>
                        </div>

                        <!-- 7 Amount Columns -->
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 15px;">
                            <div class="form-group" style="background: #f8fafc; padding: 10px; border-radius: 4px; border: 1px solid #e2e8f0;">
                                <label style="font-weight: bold; color: var(--primary);">नगद मौज्दात (Cash)</label>
                                <div style="display: flex; gap: 10px; margin-top: 5px;">
                                    <input type="number" id="tx-cash-dr" min="0" step="any" class="form-control" placeholder="डेबिट (Dr)">
                                    <input type="number" id="tx-cash-cr" min="0" step="any" class="form-control" placeholder="क्रेडिट (Cr)">
                                </div>
                            </div>
                            
                            <div class="form-group" style="background: #f8fafc; padding: 10px; border-radius: 4px; border: 1px solid #e2e8f0;">
                                <label style="font-weight: bold; color: var(--primary);">बैंक मौज्दात (Bank)</label>
                                <div style="display: flex; gap: 10px; margin-top: 5px;">
                                    <input type="number" id="tx-bank-dr" min="0" step="any" class="form-control" placeholder="डेबिट (Dr)">
                                    <input type="number" id="tx-bank-cr" min="0" step="any" class="form-control" placeholder="क्रेडिट (Cr)">
                                </div>
                            </div>

                            <div class="form-group" style="background: #f8fafc; padding: 10px; border-radius: 4px; border: 1px solid #e2e8f0;">
                                <label style="font-weight: bold; color: var(--primary);">बजेट खर्च (Budget Exp)</label>
                                <div style="display: flex; gap: 10px; margin-top: 5px;">
                                    <input type="number" id="tx-budget-exp" min="0" step="any" class="form-control" placeholder="रकम (Amount)">
                                </div>
                            </div>

                            <div class="form-group" style="background: #f8fafc; padding: 10px; border-radius: 4px; border: 1px solid #e2e8f0;">
                                <label style="font-weight: bold; color: var(--primary);">विविध (Misc)</label>
                                <div style="display: flex; gap: 10px; margin-top: 5px;">
                                    <input type="number" id="tx-misc-dr" min="0" step="any" class="form-control" placeholder="डेबिट (Dr)">
                                    <input type="number" id="tx-misc-cr" min="0" step="any" class="form-control" placeholder="क्रेडिट (Cr)">
                                </div>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <button type="button" class="btn-secondary" onclick="toggleEntryForm()">रद्द गर्नुहोस् (Cancel)</button>
                            <button type="submit" class="btn-portal" style="margin-left: 10px;">सुरक्षित गर्नुहोस् (Save)</button>
                        </div>
                    </form>
                </div>

                <!-- Data Table Container -->
                <div class="report-table-container" id="report-printable-area">
                    <!-- Summary Cards (Injected via JS if needed) -->
                    <div id="report-summary-container"></div>
                    
                    <!-- Table goes here -->
                    <div id="report-table-wrapper">
                        <!-- Loading State -->
                        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                            <div class="spinner"></div>
                            <p>Loading report data...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/database.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
